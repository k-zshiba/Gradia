name: Release Windows
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: gradia-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Require a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main' }
      - run: npm ci
      - name: Validate tag, versions and release notes
        run: node scripts/verify-release.mjs
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare verified Windows bundler tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/prepare-bundler.ps1
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is required' }
          npm run package
      - name: Assemble updater manifest and checksums
        run: node scripts/make-release.mjs
      - name: Publish all assets together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-windows-${{ github.ref_name }}
          path: |
            .tools/release/
            test-results/
